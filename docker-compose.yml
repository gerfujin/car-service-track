services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personalproject-frontend
    ports:
      - "81:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: WebApp/Dockerfile
    container_name: personalproject-backend
    ports:
      - "80:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=carservicetrack;Username=postgres;Password=postgres
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: personalproject-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: carservicetrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - personalproject_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carservicetrack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  personalproject_pgdata: