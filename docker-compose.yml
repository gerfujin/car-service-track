services:
  aspnet:
    build: .
    container_name: aspnet
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    logging:
      options:
        max-size: 10m
        max-file: "3"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=postgres;Port=5432;Database=dockerdemo;Username=postgres;Password=postgres"
    volumes:
      - aspnet-uploads:/app/WebApp/wwwroot/uploads
      
  postgres:
    container_name: "postgres"
    pull_policy: always
    # https://github.com/baosystems/docker-postgis/pkgs/container/postgis
    image: ghcr.io/baosystems/postgis:18
    command: postgres -c 'max_connections=1000'
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-dev-data:/var/lib/postgresql

  pgadmin:
    container_name: "pgadmin"
    pull_policy: always
    image: dpage/pgadmin4:latest
    logging:
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - PGADMIN_DEFAULT_EMAIL=akaver@akaver.com
      - PGADMIN_DEFAULT_PASSWORD=Foo.bar1
    ports:
      - "88:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    
volumes:
  postgres-dev-data:
  aspnet-uploads:
  pgadmin-data: