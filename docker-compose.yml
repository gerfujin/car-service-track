services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://alejeg-a5back.proxy.itcollege.ee
    ports:
      - "98:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: WebApp/Dockerfile
    ports:
      - "99:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=carservicetrack;Username=postgres;Password=postgres
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: carservicetrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - a5_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carservicetrack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  a5_pgdata: